services:
  web:
    build:
      context: .
      target: web
    image: repolight-web:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REPOLIGHT_WEB_PORT:-3048}:3000"
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS application origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set a random session secret of at least 32 characters}
      DATABASE_URL: ${DATABASE_URL:?Set the intended Neon database URL}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  worker:
    build:
      context: .
      target: worker
    image: repolight-worker:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the intended Neon database URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REPOLIGHT_GITHUB_APP_ID: ${REPOLIGHT_GITHUB_APP_ID:-}
      REPOLIGHT_GITHUB_APP_INSTALLATION_ID: ${REPOLIGHT_GITHUB_APP_INSTALLATION_ID:-}
      REPOLIGHT_GITHUB_APP_PRIVATE_KEY: ${REPOLIGHT_GITHUB_APP_PRIVATE_KEY:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
